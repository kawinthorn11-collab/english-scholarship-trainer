<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Scholarship Exam Trainer</title>
    <script>
      (function () {
        var base = '/english-scholarship-trainer/';
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\/+/, '');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var target = base + '?redirect=/' + encodeURIComponent(route).replace(/%2F/g, '/') + search + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    Redirecting to English Scholarship Exam Trainer...
  </body>
</html>
