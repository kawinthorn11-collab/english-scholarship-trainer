name: 🔍 แจ้งเฉลยผิด / คำอธิบายไม่ชัด
description: เจอข้อที่เฉลยผิด พิมพ์ผิด หรืออธิบายแล้วงง
title: "[แก้เนื้อหา] "
labels: ["content", "fix"]
body:
  - type: input
    id: where
    attributes:
      label: อยู่ตรงไหน
      placeholder: "เช่น ชุด M-Style ข้อ 21 หรือ บทเรียนแกรมม่า หัวข้อคำเชื่อม"
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: ปัญหาคืออะไร
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes:
      label: ควรแก้เป็นอะไร
