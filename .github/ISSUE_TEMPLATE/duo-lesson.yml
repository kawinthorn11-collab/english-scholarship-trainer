name: 🐷 เสนอบทเรียนหมูควาย
description: ไอเดียหัวข้อหรือบทสนทนาใหม่สำหรับห้องเรียนหมูควาย
title: "[บทเรียนหมูควาย] "
labels: ["content", "duo-lesson"]
body:
  - type: input
    id: topic
    attributes:
      label: หัวข้อ
      placeholder: "เช่น a / an / the, Reported speech, เดาความหมายศัพท์จากบริบท"
    validations: { required: true }
  - type: textarea
    id: dialogue
    attributes:
      label: บทสนทนา (ถ้ามี)
      description: ประโยคสั้น ๆ สลับกันพูด จะถูกอ่านออกเสียง
      placeholder: "หมู: ...\nควาย: ...\nตัวอย่างภาษาอังกฤษ: ..."
  - type: textarea
    id: quiz
    attributes:
      label: คำถามท้ายบท (ถ้ามี)
