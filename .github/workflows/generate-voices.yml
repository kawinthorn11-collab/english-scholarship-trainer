name: Generate voices (ElevenLabs)

# Run manually from the Actions tab. Records the pig & buffalo lines with
# ElevenLabs, commits the MP3 files to public/audio, then the deploy workflow
# publishes them. Needs the repository secret ELEVENLABS_API_KEY.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "core = lessons, tips, tests, flashcards (~18k characters). all = also every mock-exam explanation (~55k characters)."
        type: choice
        options: [core, all]
        default: core
      limit:
        description: "Maximum new recordings this run (0 = no limit)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: generate-voices
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record new lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          ELEVENLABS_VOICE_PIG: ${{ vars.ELEVENLABS_VOICE_PIG }}
          ELEVENLABS_VOICE_BUFFALO: ${{ vars.ELEVENLABS_VOICE_BUFFALO }}
          SCOPE: ${{ inputs.scope }}
          LIMIT: ${{ inputs.limit }}
        run: node scripts/generateVoices.mjs --scope="$SCOPE" --limit="$LIMIT"

      - name: Commit recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "No new recordings."
          else
            git commit -m "Update ElevenLabs voice recordings"
            git push
          fi
