name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Teachers' voices: record every fixed line with natural neural voices
      # (Thai + English). Clips are cached between runs, so only new or
      # changed lines are recorded. If recording fails the site still works
      # and falls back to the device's own voices.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore recorded voices
        uses: actions/cache@v4
        with:
          path: public/voice
          key: voice-${{ hashFiles('src/data/**', 'scripts/collectSpeech.mjs', 'scripts/recordVoices.py', 'src/utils/speechText.js') }}
          restore-keys: voice-

      - name: Record teacher voices
        continue-on-error: true
        timeout-minutes: 40
        run: |
          pip install edge-tts==7.3.1
          node scripts/collectSpeech.mjs > speech-lines.json
          python scripts/recordVoices.py speech-lines.json public/voice

      - name: Build
        env:
          # Member login. Set these in Settings → Secrets and variables → Actions → Variables.
          # The anon key is designed to be public (Row Level Security protects the data).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
